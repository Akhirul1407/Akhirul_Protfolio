<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1C1C26" />
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C6F432" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#0A0A0F" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#26262F" stroke-width="2" />

  <!-- Brand Mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="#C6F432" />
    <text x="32" y="44" font-family="Space Grotesk, system-ui, sans-serif" font-size="28" font-weight="800" fill="#0A0A0F" text-anchor="middle" letter-spacing="-1">AI</text>
    
    <text x="88" y="32" font-family="Space Grotesk, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">MD. Akhirul Islam</text>
    <text x="88" y="56" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#C6F432">Project Manager · Innovate Solution</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="250" font-family="Space Grotesk, system-ui, sans-serif" font-size="56" font-weight="800" fill="#F4F4F5" letter-spacing="-2">
    I don't just manage projects.
  </text>
  <text x="80" y="320" font-family="Space Grotesk, system-ui, sans-serif" font-size="56" font-weight="800" fill="#F4F4F5" letter-spacing="-2">
    I ship them.
  </text>
  <path d="M125 334 C160 330 220 330 250 334" stroke="#C6F432" stroke-width="6" stroke-linecap="round" />

  <!-- Subtitle -->
  <text x="80" y="400" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#A1A1AA">
    Travel tech · Calm launches · High-velocity engineering alignment
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(80, 480)">
    <!-- Pill 1: Location -->
    <rect width="210" height="44" rx="22" fill="#13131A" stroke="#26262F" stroke-width="1.5" />
    <circle cx="24" cy="22" r="5" fill="#C6F432" />
    <text x="40" y="28" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#F4F4F5">Based in Bangladesh</text>

    <!-- Pill 2: Domain -->
    <rect x="230" width="220" height="44" rx="22" fill="#13131A" stroke="#26262F" stroke-width="1.5" />
    <text x="250" y="28" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#C6F432">akhirulislam.com</text>
  </g>
</svg>
